<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeGen" />
    <link rel="manifest" href="/manifest.json" />
    <title>Life Generation</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>

    <!-- Set theme before first paint - prevents flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lg-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <!-- PWA Splash Screen styles -->
    <style>
      /* ===== Splash root ===== */
      #lg-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Deep space gradient - no orange */
        background:
          radial-gradient(ellipse 90% 55% at 50% 5%,  rgba(99,102,241,0.20) 0%, transparent 70%),
          radial-gradient(ellipse 60% 50% at 85% 92%, rgba(139,92,246,0.16) 0%, transparent 65%),
          radial-gradient(ellipse 50% 45% at 8%  80%, rgba(59,130,246,0.12) 0%, transparent 60%),
          linear-gradient(160deg, #0d0f1a 0%, #080b14 55%, #0a0d18 100%);
        pointer-events: none;
        overflow: hidden;
        transition: opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1),
                    transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #lg-splash.lg-hidden {
        opacity: 0;
        transform: scale(1.04);
      }

      /* ===== Ambient orbs (background glow) ===== */
      .lg-sp-orb {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        will-change: transform;
      }
      .lg-sp-orb-1 {
        width: 420px; height: 420px;
        top: -120px; left: -80px;
        background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 68%);
        filter: blur(60px);
        animation: lgOrbDrift1 9s ease-in-out infinite;
      }
      .lg-sp-orb-2 {
        width: 320px; height: 320px;
        bottom: -80px; right: -50px;
        background: radial-gradient(circle, rgba(139,92,246,0.16) 0%, transparent 68%);
        filter: blur(50px);
        animation: lgOrbDrift2 11s ease-in-out infinite;
      }
      .lg-sp-orb-3 {
        width: 200px; height: 200px;
        bottom: 25%; left: 8%;
        background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 68%);
        filter: blur(40px);
        animation: lgOrbDrift3 7.5s ease-in-out infinite;
      }

      /* ===== Logo ring wrapper ===== */
      .lg-sp-ring {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
        animation: lgFadeSlideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
      }
      /* Spinning conic gradient border */
      .lg-sp-ring::before {
        content: '';
        position: absolute;
        inset: -16px;
        border-radius: 38px;
        background: conic-gradient(
          from 180deg at 50% 50%,
          rgba(99,102,241,0.0)  0%,
          rgba(99,102,241,0.7) 20%,
          rgba(139,92,246,0.6) 40%,
          rgba(99,102,241,0.7) 60%,
          rgba(99,102,241,0.0) 80%,
          rgba(99,102,241,0.0) 100%
        );
        animation: lgSpin 3.5s linear infinite;
        /* Mask to only show the border stroke */
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), white calc(100% - 1.5px));
        mask:         radial-gradient(farthest-side, transparent calc(100% - 1.5px), white calc(100% - 1.5px));
      }
      /* Soft outer glow */
      .lg-sp-ring::after {
        content: '';
        position: absolute;
        inset: -24px;
        border-radius: 44px;
        background: radial-gradient(ellipse at center, rgba(99,102,241,0.22) 0%, transparent 68%);
        filter: blur(16px);
        animation: lgPulseGlow 2.6s ease-in-out 0.5s infinite;
      }

      /* ===== Logo icon ===== */
      .lg-sp-icon {
        position: relative;
        z-index: 1;
        width: 100px;
        height: 100px;
        border-radius: 26px;
        overflow: hidden;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.09);
        box-shadow:
          0 12px 40px rgba(0,0,0,0.55),
          0 4px  12px rgba(0,0,0,0.35),
          inset 0 1px 0 rgba(255,255,255,0.07);
        animation: lgFloat 4.2s ease-in-out 1.4s infinite;
        will-change: transform;
      }
      .lg-sp-icon img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      /* ===== App name wordmark ===== */
      .lg-sp-name {
        position: relative;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.40);
        margin-bottom: 48px;
        animation: lgFadeSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
        overflow: hidden;
        white-space: nowrap;
      }
      /* Shimmer sweep */
      .lg-sp-name::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 0%,
          transparent 35%,
          rgba(255,255,255,0.55) 50%,
          transparent 65%,
          transparent 100%
        );
        background-size: 220% 100%;
        animation: lgShimmer 2.8s cubic-bezier(0.4, 0, 0.6, 1) 1.5s infinite;
      }

      /* ===== Slim progress bar ===== */
      .lg-sp-bar-track {
        width: 100px;
        height: 1.5px;
        border-radius: 2px;
        background: rgba(255,255,255,0.07);
        overflow: hidden;
        animation: lgFadeSlideUp 0.6s ease 0.7s both;
      }
      .lg-sp-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg,
          rgba(99,102,241,0.0)  0%,
          rgba(99,102,241,1.0) 30%,
          rgba(139,92,246,1.0) 65%,
          rgba(99,102,241,0.9) 100%
        );
        animation:
          lgBarFill    5.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.9s forwards,
          lgBarGlow    1.8s ease-in-out 0.9s infinite;
      }

      /* ===== Keyframes ===== */
      @keyframes lgFadeSlideUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes lgFloat {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-9px); }
      }
      @keyframes lgSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes lgPulseGlow {
        0%, 100% { opacity: 0.45; transform: scale(0.94); }
        50%      { opacity: 1.00; transform: scale(1.06); }
      }
      @keyframes lgShimmer {
        0%   { background-position:  200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes lgBarFill {
        0%   { width:  0%; }
        20%  { width: 30%; }
        50%  { width: 60%; }
        80%  { width: 84%; }
        100% { width: 97%; }
      }
      @keyframes lgBarGlow {
        0%, 100% { box-shadow: 0 0 6px rgba(99,102,241,0.4); }
        50%      { box-shadow: 0 0 14px rgba(139,92,246,0.7); }
      }
      @keyframes lgOrbDrift1 {
        0%, 100% { transform: translate(0,    0)    scale(1.00); }
        33%      { transform: translate(32px, 24px) scale(1.08); }
        66%      { transform: translate(-18px,38px) scale(0.94); }
      }
      @keyframes lgOrbDrift2 {
        0%, 100% { transform: translate(0,     0)     scale(1.00); }
        40%      { transform: translate(-28px,-32px)  scale(1.10); }
        70%      { transform: translate(22px, -18px)  scale(0.92); }
      }
      @keyframes lgOrbDrift3 {
        0%, 100% { transform: translate(0,    0); }
        50%      { transform: translate(22px,-28px); }
      }
    </style>
  </head>
  <body>

    <!-- PWA Splash - auto-removed when React mounts -->
    <div id="lg-splash" aria-hidden="true">
      <!-- Ambient background orbs -->
      <div class="lg-sp-orb lg-sp-orb-1"></div>
      <div class="lg-sp-orb lg-sp-orb-2"></div>
      <div class="lg-sp-orb lg-sp-orb-3"></div>

      <!-- Logo with spinning ring -->
      <div class="lg-sp-ring">
        <div class="lg-sp-icon">
          <img src="/icon-192.png" alt="LifeGen" width="100" height="100" />
        </div>
      </div>

      <!-- Wordmark -->
      <div class="lg-sp-name">Life Generation</div>

      <!-- Progress bar -->
      <div class="lg-sp-bar-track">
        <div class="lg-sp-bar-fill"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Remove splash once React has rendered -->
    <script>
      (function () {
        var splash = document.getElementById('lg-splash')
        if (!splash) return
        var root = document.getElementById('root')
        // Watch for React to inject its first child into #root
        var obs = new MutationObserver(function () {
          if (root.firstChild) {
            obs.disconnect()
            splash.classList.add('lg-hidden')
            setTimeout(function () {
              if (splash.parentNode) splash.parentNode.removeChild(splash)
            }, 800)
          }
        })
        obs.observe(root, { childList: true })
        // Hard fallback - remove after 7s regardless
        setTimeout(function () {
          obs.disconnect()
          splash.classList.add('lg-hidden')
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash)
          }, 800)
        }, 7000)
      })()
    </script>

  </body>
</html>
