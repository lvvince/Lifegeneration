<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeGen" />
    <link rel="manifest" href="/manifest.json" />
    <title>Life Generation</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>

    <!-- Set theme before first paint — prevents flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lg-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <!-- PWA Splash Screen styles -->
    <style>
      #lg-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        background: #0a0a0a;
        pointer-events: none;
        transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #lg-splash.lg-hidden {
        opacity: 0;
      }

      /* Logo container — floats gently */
      .lg-sp-icon {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        overflow: hidden;
        margin-bottom: 32px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
        animation: lgIconIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both,
                   lgFloat 3.6s ease-in-out 0.7s infinite;
        will-change: transform, opacity;
      }
      .lg-sp-icon img {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Wordmark */
      .lg-sp-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 48px;
        animation: lgWordIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
      }

      /* Three-dot loader */
      .lg-sp-dots {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .lg-sp-dots span {
        display: block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        animation: lgDot 1.4s ease-in-out infinite;
      }
      .lg-sp-dots span:nth-child(1) { animation-delay: 0s; }
      .lg-sp-dots span:nth-child(2) { animation-delay: 0.18s; }
      .lg-sp-dots span:nth-child(3) { animation-delay: 0.36s; }

      /* Keyframes */
      @keyframes lgIconIn {
        from { opacity: 0; transform: scale(0.72) translateY(10px); }
        to   { opacity: 1; transform: scale(1)    translateY(0); }
      }
      @keyframes lgFloat {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-6px); }
      }
      @keyframes lgWordIn {
        from { opacity: 0; letter-spacing: 0.08em; }
        to   { opacity: 1; letter-spacing: 0.22em; }
      }
      @keyframes lgDot {
        0%, 80%, 100% { transform: scale(1);    opacity: 0.25; }
        40%           { transform: scale(1.55); opacity: 0.9; }
      }
    </style>
  </head>
  <body>

    <!-- PWA Splash — auto-removed when React mounts -->
    <div id="lg-splash" aria-hidden="true">
      <div class="lg-sp-icon">
        <img src="/icon-192.png" alt="LifeGen" width="88" height="88" />
      </div>
      <div class="lg-sp-name">Life Generation</div>
      <div class="lg-sp-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Remove splash once React has rendered -->
    <script>
      (function () {
        var splash = document.getElementById('lg-splash')
        if (!splash) return
        var root = document.getElementById('root')
        // Watch for React to inject its first child into #root
        var obs = new MutationObserver(function () {
          if (root.firstChild) {
            obs.disconnect()
            splash.classList.add('lg-hidden')
            setTimeout(function () {
              if (splash.parentNode) splash.parentNode.removeChild(splash)
            }, 600)
          }
        })
        obs.observe(root, { childList: true })
        // Hard fallback — remove after 6s regardless
        setTimeout(function () {
          obs.disconnect()
          splash.classList.add('lg-hidden')
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash)
          }, 600)
        }, 6000)
      })()
    </script>

  </body>
</html>
